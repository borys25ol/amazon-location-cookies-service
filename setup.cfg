[flake8]
# Only mccabe, pycodestyle and pyflakes run here. The plugin-specific
# settings and ignore codes that used to live in this section were dead:
# nothing installed could emit them. See git history if wemake-python-styleguide
# ever comes back.
max-complexity = 15
max-line-length = 88
ignore =
    F401, F403, F405, E501, E741, E999, F821, F901, W291, W504
    # black handles line breaks around binary operators and slice colons
    W503, E203
exclude =
    env
    .git
    .ve
    setup.py
    Makefile
    README.md
    requirements.txt
    __pycache__
    .DS_Store
    .isort,
    docker-compose.yml


[mypy]
python_version = 3.12
ignore_missing_imports = True
allow_redefinition = True
warn_no_return = False
check_untyped_defs = False
disallow_untyped_defs = True
warn_unused_ignores = True
follow_imports = skip
strict_optional = True
exclude = .ve|env|logs

[tool:pytest]
norecursedirs=.ve
addopts = -ra -q -s -v
# The `pytest` script does not put the project root on sys.path the way
# `python -m pytest` does, so without this the tests cannot import `main`.
pythonpath = .
