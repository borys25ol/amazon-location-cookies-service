name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python environment
        uses: actions/setup-python@v7
        with:
          # Kept in step with the Dockerfile: checking on one version while
          # shipping another is how a release that had no wheels for the
          # image's interpreter went unnoticed.
          python-version: '3.14'

      - name: Install requirements
        run: pip install -r requirements-ci.txt

      - name: Style checking
        run: make style

      - name: Types checking
        run: make types

      # The suite stubs out every network call, so no browser is needed here.
      - name: Tests
        run: make test

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Building the image is the only thing that exercises the interpreter and
      # the browser the service actually runs on. Its own job, so the fast
      # checks above are not held up by it.
      - name: Build the image
        run: docker build -t amazon-location-cookies .
