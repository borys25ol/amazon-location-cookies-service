name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r requirements-ci.txt

      - name: Style checking
        run: make style

      - name: Types checking
        run: make types

      # The suite stubs out every network call, so no browser is needed here.
      - name: Tests
        run: make test
