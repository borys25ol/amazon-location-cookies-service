version: '3.8'

services:
  web:
    build: .
    command: "uvicorn main.api.app:app --host 0.0.0.0 --port 8000"
    container_name: amazon-location-web
    environment:
      # Overrides the baked-in .env, which points at localhost for host runs.
      SCRAPYRT_URL: "http://scrapyrt:7800/crawl.json"
    ports:
      - "8000:8000"
    depends_on:
      - scrapyrt

  scrapyrt:
    build: .
    command: "scrapyrt --ip 0.0.0.0 --port 7800"
    container_name: amazon-location-scrapyrt
    ports:
      - "7800:7800"
